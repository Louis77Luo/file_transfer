# Install after obtaining a Let's Encrypt certificate for file.louis77.top.
server {
    listen 80;
    listen [::]:80;
    server_name file.louis77.top;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://file.louis77.top$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name file.louis77.top;
    ssl_certificate /etc/letsencrypt/live/file.louis77.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/file.louis77.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20g;
    client_body_timeout 3600s;
    send_timeout 3600s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /healthz { return 404; }
}
